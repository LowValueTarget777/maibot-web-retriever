[plugin]
enabled = true
config_version = "1.0.0"

[search]
# SearXNG 实例地址
searxng_base_url = "http://192.168.1.9:8800"
# 搜索类别开关
search_general = true
search_news = true
search_science = true
search_it = true
# 单次搜索最大返回条数
max_results = 5
# 搜索超时时间（秒）
search_timeout = 10
# 安全搜索: 0=关闭, 1=中等, 2=严格
safe_search = 0

[fetch]
crawl4ai_base_url = "http://192.168.1.9:11235"
fetch_timeout = 30
max_content_length = 8000
filter_mode = "fit"
proxy = "http://192.168.1.13:7890"
proxy_username = ""
proxy_password = ""

[cache]
enable_cache = true
cache_ttl = 3600
max_cache_entries = 100

[plugin]
enabled = true
config_version = "1.0.0"
# 搜索/抓取时是否发送进度提示
show_progress = false
# 是否将网页 URL 作为参考来源提供给 AI
show_references = false
# 是否在回复末尾向用户发送参考来源链接
send_references_to_user = true

[search]
# SearXNG 实例地址
searxng_base_url = "http://192.168.1.9:8800"
# 搜索类别开关
search_general = true
search_news = true
search_science = false
search_it = false
# 单次搜索最大返回条数
max_results = 3
# 搜索超时时间（秒）
search_timeout = 30
# 安全搜索: 0=关闭, 1=中等, 2=严格
safe_search = 0

[fetch]
# Crawl4AI REST API 地址（Docker 部署自带浏览器）
crawl4ai_base_url = "http://192.168.1.9:11235"
fetch_timeout = 30
max_content_length = 8000
# 内容超长时是否调用 AI 总结代替截断
summary_enabled = true
filter_mode = "fit"
proxy = "http://192.168.1.13:7890"
proxy_username = ""
proxy_password = ""

[cache]
enable_cache = true
cache_ttl = 3600
max_cache_entries = 100
